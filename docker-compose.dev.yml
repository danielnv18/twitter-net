name: twitter-net-dev

services:
  db:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: twitter_net_dev
      MYSQL_USER: twitter_net_dev
      MYSQL_PASSWORD: twitter_net_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
