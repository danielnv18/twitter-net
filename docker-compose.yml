name: twitter-net

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-database-environment: &database-environment
  Database__Server: db
  Database__Port: 3306
  Database__Name: ${MYSQL_DATABASE:-twitter_net}
  Database__User: ${MYSQL_USER:-twitter_net}
  Database__Password: ${MYSQL_PASSWORD:-twitter_net_dev}

services:
  api:
    build:
      context: ./api
      target: runtime
    init: true
    logging: *default-logging
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      <<: *database-environment
      ASPNETCORE_ENVIRONMENT: Production
      Auth__AllowInsecureHttp: ${AUTH_ALLOW_INSECURE_HTTP:-false}
      Auth__KnownProxies__0: ${AUTH_TRUSTED_PROXY_IP:-172.30.0.10}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  ef:
    profiles:
      - tools
    build:
      context: ./api
      target: ef-tools
    init: true
    logging: *default-logging
    environment: *database-environment
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: runtime
    init: true
    logging: *default-logging
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10

  db:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    logging: *default-logging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-twitter_net}
      MYSQL_USER: ${MYSQL_USER:-twitter_net}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-twitter_net_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
